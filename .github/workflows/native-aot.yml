name: Native AOT

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    native-aot-smoke:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-aot-smoke.yml@main
        with:
            projectFile: src/tests/ReactiveUI.Binding.AotValidation/ReactiveUI.Binding.AotValidation.csproj
            # The referenced runtime builds Apple heads on Windows and macOS, and restoring them needs their workloads.
            installWorkloads: true
